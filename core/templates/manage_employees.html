<!DOCTYPE html>
<html>
<head>
    <title>Manage Employees</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --emerald: #00d084;
            --midnight: #040404;
            --glass: rgba(25,25,25,0.6);
            --border: rgba(255,255,255,0.08);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 40px;
            background:
                radial-gradient(circle at 20% 20%, rgba(0,208,132,0.06), transparent 40%),
                var(--midnight);
            color: #fff;
        }

        h2, h3 {
            margin-bottom: 20px;
        }

        /* LAYOUT WRAPPER */
        .wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            align-items: flex-start;
        }

        /* FORM */
        form {
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            padding: 25px;
            width: 320px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: 0.3s;
        }

        form:hover {
            transform: translateY(-5px);
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 1px solid transparent;
            background: rgba(255,255,255,0.05);
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: var(--emerald);
            box-shadow: 0 0 12px rgba(0,208,132,0.3);
        }

        select:hover {
            border-color: var(--emerald);
            background: rgba(0,208,132,0.08);
        }

        select option {
            background: #0a0a0a;
            color: #fff;
        }

        button {
            width: 100%;
            padding: 11px;
            background: var(--emerald);
            color: black;
            border: none;
            border-radius: 100px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0,208,132,0.5);
        }

        /* TABLE SECTION */
        .table-section {
            flex: 1;
            min-width: 400px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        th {
            background: rgba(0,208,132,0.15);
            color: var(--emerald);
        }

        th, td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        tr {
            transition: 0.3s;
        }

        tr:hover {
            background: rgba(0,208,132,0.05);
            transform: scale(1.01);
        }

        a.delete-btn {
            color: #ff4d4d;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        a.delete-btn:hover {
            color: red;
            text-shadow: 0 0 10px red;
        }

        p {
            color: #aaa;
        }

        /* 📱 RESPONSIVE */
        @media (max-width: 768px) {
            body {
                padding: 20px;
            }

            .wrapper {
                flex-direction: column;
            }

            form {
                width: 100%;
            }

            h2 {
                font-size: 22px;
            }

            h3 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<h2>👤 Manage Employees</h2>

<div class="wrapper">

    <!-- FORM -->
    <form method="POST" action="{% url 'manage_employees' %}">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>

        <select name="role" required>
            <option value="">Select Role</option>
            <option value="employee">Employee</option>
            <option value="csr">Customer Service Representative</option>
            <option value="loan_officer">Loan Officer</option>
            <option value="branch_manager">Branch Manager</option>
        </select>

        <button type="submit">Add User</button>
    </form>

    <!-- TABLE -->
    <div class="table-section">

        <h3>📋 Employee List</h3>

        {% if employees %}
        <div class="table-container">
        <table>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th>Action</th>
            </tr>

            {% for emp in employees %}
            <tr>
                <td>{{ emp.id }}</td>
                <td>{{ emp.username }}</td>
                <td>{{ emp.email }}</td>
                <td>{{ emp.get_role_display }}</td>
                <td>
                    <a class="delete-btn" href="{% url 'delete_employee' emp.id %}">
                        Delete
                    </a>
                </td>
            </tr>
            {% endfor %}
        </table>
        </div>
        {% else %}
        <p>No employees added yet.</p>
        {% endif %}

    </div>

</div>

</body>
</html>
