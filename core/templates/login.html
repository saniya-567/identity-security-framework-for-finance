<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --emerald: #00d084;
            --midnight: #060606;
            --glass-card: rgba(25, 25, 25, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--midnight);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }

        /* Ambient glow */
        .ambient-glow {
            position: fixed;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(0, 208, 132, 0.08) 0%, transparent 70%);
            top: -15%;
            left: -10%;
            z-index: -1;
            filter: blur(100px);
        }

        /* Glass container */
        .container {
            background: var(--glass-card);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px 30px;
            width: 320px;
            text-align: center;
            transition: 0.4s;
        }

        .container:hover {
            transform: translateY(-5px);
            border-color: var(--emerald);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h2 {
            color: white;
            font-weight: 700;
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid transparent;
            background: rgba(255,255,255,0.05);
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--emerald);
            background: rgba(255,255,255,0.08);
        }

        button {
            width: 95%;
            padding: 12px;
            background: var(--emerald);
            border: none;
            border-radius: 100px;
            font-weight: 700;
            cursor: pointer;
            color: black;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 208, 132, 0.4);
        }

        .register-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px;
            width: 90%;
            background: transparent;
            border: 1px solid var(--glass-border);
            color: #aaa;
            border-radius: 100px;
            text-decoration: none;
            transition: 0.3s;
        }

        .register-btn:hover {
            border-color: var(--emerald);
            color: var(--emerald);
            background: rgba(0, 208, 132, 0.05);
        }

        .error {
            color: #ff4d4d;
            font-size: 14px;
        }

    </style>
</head>

<body>

<div class="ambient-glow"></div>

<div class="container">
    <h2>Login</h2>

    {% for message in messages %}
        <p class="error">{{ message }}</p>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <a href="{% url 'signup' %}" class="register-btn">New User? Register</a>

</div>

</body>
</html>
