<!DOCTYPE html>
<html>
<head>
<title>CSR Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root {
    --emerald: #00d084;
    --midnight: #040404;
    --glass: rgba(25,25,25,0.6);
    --border: rgba(255,255,255,0.08);
}

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    margin: 0;
    background:
        radial-gradient(circle at 20% 20%, rgba(0,208,132,0.08), transparent 40%),
        var(--midnight);
    color: #fff;
}

/* NAVBAR */
.navbar {
    margin: 20px;
    background: var(--glass);
    backdrop-filter: blur(25px);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 15px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.navbar h2 {
    margin: 0;
    font-size: 18px;
}

.navbar a {
    color: #aaa;
    padding: 8px 16px;
    text-decoration: none;
    border-radius: 100px;
    margin-left: 10px;
    transition: 0.3s;
}

/* Primary button */
.navbar .add {
    background: var(--emerald);
    color: black;
    font-weight: 600;
}

.navbar .add:hover {
    box-shadow: 0 0 15px rgba(0,208,132,0.5);
    transform: scale(1.05);
}

.navbar a:hover {
    background: rgba(0,208,132,0.1);
    color: var(--emerald);
}

/* TABLE */
.container {
    padding: 20px;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: var(--glass);
    backdrop-filter: blur(25px);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}

th {
    background: rgba(0,208,132,0.15);
    color: var(--emerald);
    font-weight: 600;
}

th, td {
    padding: 14px;
    text-align: center;
    border-bottom: 1px solid var(--border);
}

tr {
    transition: 0.3s;
}

tr:hover {
    background: rgba(0,208,132,0.05);
    transform: scale(1.01);
}

/* STATUS BADGE */
.status {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(255,255,255,0.05);
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .navbar {
        flex-direction: column;
        gap: 10px;
        border-radius: 20px;
    }

    .container {
        padding: 10px;
    }

    th, td {
        padding: 10px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="navbar">
    <h2>🧑‍💼 CSR Dashboard</h2>

    <div>
        <a class="add" href="{% url 'create_loan' %}">+ Create Loan</a>
        <a href="{% url 'logout' %}">Logout</a>
    </div>
</div>

<div class="container">
<div class="table-container">

<table>

<tr>
    <th>User</th>
    <th>Amount</th>
    <th>Loan Type</th>
    <th>Status</th>
</tr>

{% for loan in loans %}
<tr>
    <td>{{ loan.username }}</td>
    <td>₹ {{ loan.amount }}</td>
    <td>{{ loan.loan_type }}</td>
    <td>
        <span class="status">{{ loan.status }}</span>
    </td>
</tr>
{% endfor %}

</table>

</div>
</div>

</body>
</html>
