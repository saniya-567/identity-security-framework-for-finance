<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
    :root {
        --emerald: #00d084;
        --midnight: #040404;
        --glass: rgba(25,25,25,0.6);
        --border: rgba(255,255,255,0.08);
    }

    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background:
            radial-gradient(circle at 20% 20%, rgba(0,208,132,0.08), transparent 40%),
            var(--midnight);
        color: #fff;
    }

    /* 🔥 Glass Login Box */
    .box {
        background: var(--glass);
        backdrop-filter: blur(30px);
        border: 1px solid var(--border);
        padding: 40px 30px;
        border-radius: 25px;
        text-align: center;
        width: 320px;
        box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        transition: 0.3s;
    }

    .box:hover {
        transform: translateY(-6px);
    }

    h2 {
        margin-bottom: 20px;
        letter-spacing: 0.5px;
    }

    input {
        width: 100%;
        padding: 11px;
        margin: 10px 0;
        border-radius: 12px;
        border: 1px solid transparent;
        background: rgba(255,255,255,0.05);
        color: #fff;
        outline: none;
        transition: 0.3s;
    }

    input:focus {
        border-color: var(--emerald);
        box-shadow: 0 0 12px rgba(0,208,132,0.3);
    }

    /* 🔘 Button */
    button {
        width: 100%;
        padding: 11px;
        margin-top: 10px;
        background: var(--emerald);
        color: black;
        border: none;
        border-radius: 100px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 25px rgba(0,208,132,0.5);
    }

    /* ❌ Error Message */
    .error {
        color: #ff4d4d;
        font-size: 14px;
        margin-bottom: 10px;
    }

    /* 📱 Responsive */
    @media (max-width: 480px) {
        .box {
            width: 90%;
            padding: 30px 20px;
        }
    }
</style>

</head>

<body>

<div class="box">
    <h2> Admin Login</h2>

{% for message in messages %}
    <p class="error">{{ message }}</p>
{% endfor %}

<form method="POST" action="{% url 'admin_login' %}">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
</form>

</div>

</body>
</html>
